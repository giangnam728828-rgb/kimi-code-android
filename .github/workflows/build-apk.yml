name: Build Kimi Code Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Project Dependencies
        run: |
          npm install

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Inject Android System Permissions
        run: |
          node scripts/inject-permissions.mjs

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Kimi-Code-Android.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kimi-Code-Android-APK
          path: output/Kimi-Code-Android.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "Kimi Code on Android v1.2.0 (自动连接版)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Kimi Code on Android 移动端启动器 v1.2.0

            本次更新的重点：**打开 App 就能用，不再需要手动敲命令启动服务。**

            - **自动连接**：App 启动即探测本地服务，就绪后可直接进入工作台；
            - **断线自动重试**：服务未就绪时每 2.5 秒自动重试，服务一起来就自动连上；
            - **可选"打开即进入"**：设置中可开启，跳过启动面板直达工作台；
            - **真实状态显示**：不再显示虚假的启动日志，只反映实际探测结果；
            - **全屏沉浸**：无地址栏，返回键可直接退回启动面板。

            ### 🚀 使用方法
            1. 下载下方的 `Kimi-Code-Android.apk` 安装；
            2. 服务会在 PocketDev 终端打开时**自动拉起**（已配置启动钩子），无需手动执行；
            3. 打开 App，等待状态变为"已就绪"，点击进入工作台即可。

            > 若服务确实未启动，可在终端执行：`bash /workspace/kimicode/kimi-serve.sh start`
          files: |
            output/Kimi-Code-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
