name: Build Kimi Code Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          cmdline-tools-version: "13114758"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          validate-wrappers: false

      - name: Unit Tests
        working-directory: android
        run: gradle --no-daemon :app:testReleaseUnitTest

      - name: Build Release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK for Distribution
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/Kimi-Code-Android.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kimi-Code-Android-APK
          path: output/Kimi-Code-Android.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v3.0.0-rc1
          name: "Kimi Code on Android v3.0.0-rc1 (自带运行环境)"
          draft: false
          prerelease: true
          body: |
            ## 📱 Kimi Code on Android v3.0.0-rc1

            这一版不再依赖电脑或终端里的服务：**Linux 运行环境、Node 运行时和整套 Kimi Code 服务端都随 App 一起装到手机上**。

            ### 装了就能用
            1. 安装 `Kimi-Code-Android.apk`；
            2. 打开 App —— 首次会下载约 87 MB 的运行环境并解压（一次性）；
            3. 解压完成后自动启动服务，并直接带 Token 打开工作台，**不会再问你要 Token**。

            ### 自带的组件
            - Ubuntu arm64 精简根文件系统
            - Node.js 24 运行时
            - Kimi Code 服务端 + Web 工作台
            - proot（免 Root 运行 Linux）
            - 内置 ripgrep

            ### 能力
            - 前台服务常驻保活，切走应用不会掉；
            - 服务崩溃自动重启；
            - 设置页可直接填写 Kimi / DeepSeek / OpenAI / Claude 的 API Key；
            - 申请外部存储权限，工作区可直接读写 `/sdcard`。

            > 模型接口需在 App 的设置页填写你自己的 API Key。
          files: |
            output/Kimi-Code-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
