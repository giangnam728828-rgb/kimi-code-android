name: Build Kimi Code Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          cmdline-tools-version: "13114758"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          validate-wrappers: false

      # Bake the Linux runtime into the APK so the first launch never needs the
      # network. The rootfs is published once and never committed to git.
      - name: Fetch rootfs into APK assets
        run: |
          set -euo pipefail
          DEST="android/app/src/main/assets/rootfs-arm64.tar.gz"
          for TAG in rootfs-v1 v3.0.0-rc1; do
            URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/rootfs-arm64.tar.gz"
            if curl -fsSL --retry 3 -o "$DEST" "$URL"; then
              echo "Fetched rootfs from ${TAG}"
              break
            fi
          done
          test -s "$DEST"
          SIZE=$(stat -c%s "$DEST")
          echo "rootfs size: $SIZE bytes"
          test "$SIZE" -gt 50000000

      # The archive is published once and is too large for git, so the runtime
      # entrypoint lives in this repo and is patched into the archive here.
      # Without this the archive would ship whatever script it was built with.
      - name: Patch runtime entrypoint into the rootfs
        run: |
          set -euo pipefail
          ARCHIVE="android/app/src/main/assets/rootfs-arm64.tar.gz"
          WORK=$(mktemp -d)
          tar -xzf "$ARCHIVE" -C "$WORK"
          install -m 0755 runtime/entrypoint.sh "$WORK/opt/kimi/entrypoint.sh"
          bash -n "$WORK/opt/kimi/entrypoint.sh"
          grep -q 'KIMI_WORKDIR' "$WORK/opt/kimi/entrypoint.sh"
          tar --numeric-owner --hard-dereference --sort=name -czf "$ARCHIVE" -C "$WORK" .
          echo "patched entrypoint; archive now $(stat -c%s "$ARCHIVE") bytes"
          rm -rf "$WORK"

      - name: Restore signing key
        id: keys
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kimicode.jks"
            # Gradle reads these in later steps, so they must outlive this one.
            # Writing only KEYSTORE_PATH left storePassword null and the
            # release build failed at :app:packageRelease.
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/kimicode.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEYSTORE_ALIAS=$KEYSTORE_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            if keytool -list -keystore "$RUNNER_TEMP/kimicode.jks" \
                -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" > /dev/null 2>&1; then
              echo "Signing key loaded; this release is signed with the stable key."
            else
              echo "::error::The restored keystore does not open with the configured alias/password."
              exit 1
            fi
            echo "signed=release-key" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret; falling back to the debug key."
            echo "signed=debug-key" >> "$GITHUB_OUTPUT"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Unit Tests
        working-directory: android
        run: gradle --no-daemon :app:testReleaseUnitTest

      - name: Build Release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK contains the bundled runtime
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -q 'assets/rootfs-arm64.tar'
          unzip -l "$APK" | grep -q 'assets/proot/libtalloc.so.2'
          unzip -l "$APK" | grep -q 'assets/proot/proot'
          echo "APK size: $(stat -c%s "$APK") bytes (signing: ${{ steps.keys.outputs.signed }})"

      - name: Rename APK for Distribution
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/Kimi-Code-Android.apk
          # Keep the release title in step with the build instead of a literal
          # that goes stale every time the version is bumped.
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "App version: $VERSION"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kimi-Code-Android-APK
          path: output/Kimi-Code-Android.apk
          if-no-files-found: error

      # Test branches: publish the APK under its own tag so it can be installed
      # directly, without touching the rootfs-v1 release used by everyone else.
      - name: Publish test APK to a separate tag
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-provider-2.17.1
          target_commitish: ${{ github.sha }}
          name: "Kimi Code Android v${{ env.APP_VERSION }} (ETA bottom sheets / rename takes effect / motion, stable key)"
          prerelease: true
          files: output/Kimi-Code-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Published once out-of-band; the workflow must not clobber it, because the
      # asset is also served from the older v3.0.0-rc1 release.
      - name: Fetch rootfs archive for the release
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/rootfs-v1/rootfs-arm64.tar.gz"
          if ! curl -fsL --retry 3 -o /tmp/rootfs-arm64.tar.gz "$URL"; then
            URL="https://github.com/${{ github.repository }}/releases/download/v3.0.0-rc1/rootfs-arm64.tar.gz"
            curl -fsL --retry 3 -o /tmp/rootfs-arm64.tar.gz "$URL"
          fi
          test -s /tmp/rootfs-arm64.tar.gz
          ls -l /tmp/rootfs-arm64.tar.gz

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: rootfs-v1
          name: "Kimi Code on Android v${{ env.APP_VERSION }} (运行环境已内置)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Kimi Code on Android

            只有一个文件要装：`Kimi-Code-Android.apk`。
            **整个 Linux 运行环境已经打进 APK 里，首次启动不需要下载任何东西。**

            ### 装了就能用
            1. 安装 `Kimi-Code-Android.apk`，**直接覆盖安装即可**，不用卸载，数据和登录状态都会保留；
            2. 打开 App，等它解压内置环境（一次性，约 1 分钟）；
            3. 自动启动本地服务，并直接带 Token 打开工作台，**不会问你要 Token**。

            ### 内置组件
            - Ubuntu arm64 精简根文件系统（249 MB）
            - Node.js 24.19.0
            - Kimi Code 服务端 2.5.2 + Web 工作台
            - proot（免 Root 运行 Linux）
            - ripgrep

            ### 界面
            - 底部五个标签页：**首页 / 插件 / 设置 / 数据 / 终端**；
            - 首页显示运行状态、访问地址、LAN 开关、当前模型和工作区路径；
            - 工作台是**全屏覆盖层**，进入时状态栏一起收起，页面从屏幕最顶端开始，
              底部标签栏不会压在工作台上；**从屏幕左边缘往右滑**即可返回；
            - **数据页**支持一键备份、按文件恢复、导出到别的手机，设置和会话一并迁移；
            - 终端页可以在容器里直接执行命令。

            ### 这一版修掉的问题
            - **登录不再白屏**：点登录后，Kimi 授权页交给系统浏览器打开，工作台留在原地等待，
              在浏览器里完成授权后回到 App 就会自动登录；授权页不会再顶掉工作台；
            - 页面加载失败会明确提示原因并给出「重新加载」按钮，不再是纯白屏；
            - 全屏工作台不再被状态栏和底部标签栏遮挡；
            - **签名固定**：所有版本都用同一把密钥签名，以后更新直接覆盖安装，
              不需要卸载，也不用担心丢数据（首次从更早的调试签名版本升级时仍需卸载一次）。

            ### 能力
            - 前台服务常驻保活，切走应用不会掉；
            - 服务崩溃自动重启；
            - 启动失败会显示真实原因（退出码 / 缺库 / 权限），而不是干等超时；
            - 设置页可填写 Kimi / DeepSeek / OpenAI / Claude 的 API Key；
            - 申请外部存储权限后，工作区可直接读写 `/sdcard`。

            ### 已知限制
            - **仅支持 arm64-v8a**（绝大多数现代手机）；
            - APK 体积约 240 MB —— 内置完整运行环境的代价；
            - 模型接口需在设置页填写你自己的 API Key。

            > `rootfs-arm64.tar.gz` 仅作备用下载源，正常安装不需要它。
          files: |
            output/Kimi-Code-Android.apk
            /tmp/rootfs-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
